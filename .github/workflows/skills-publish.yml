name: Skills Publish

on:
  push:
    branches: [main]
    paths:
      - '**/SKILL.md'
      - '*/templates/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find all SKILL.md files
        id: find
        run: |
          skills=$(find . -name "SKILL.md" -not -path "./.git/*" -not -path "./.well-known/*" | sed 's|^\./||')
          if [ -z "$skills" ]; then
            echo "❌ No SKILL.md files found"
            exit 1
          fi
          echo "Found skills:"
          echo "$skills"
          echo "skills<<EOF" >> "$GITHUB_OUTPUT"
          echo "$skills" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate frontmatter
        run: |
          errors=0
          while IFS= read -r skill_file; do
            echo "🔍 Validating: $skill_file"

            # Extract frontmatter
            frontmatter=$(sed -n '/^---$/,/^---$/p' "$skill_file" | sed '1d;$d')

            if [ -z "$frontmatter" ]; then
              echo "  ❌ Missing YAML frontmatter"
              errors=$((errors + 1))
              continue
            fi

            # Check name field
            name=$(echo "$frontmatter" | grep -E "^name:" | sed 's/^name: *//' | tr -d '"' | tr -d "'")
            if [ -z "$name" ]; then
              echo "  ❌ Missing 'name' field in frontmatter"
              errors=$((errors + 1))
            else
              # Validate name format: ^[a-z0-9-]+$, 1-64 chars, no --, no leading/trailing -
              if ! echo "$name" | grep -qE '^[a-z0-9-]{1,64}$'; then
                echo "  ❌ Invalid name '$name': must be 1-64 chars, lowercase alphanumeric + hyphens"
                errors=$((errors + 1))
              elif echo "$name" | grep -qE '(^--|-$|^.*--.*$)'; then
                echo "  ❌ Invalid name '$name': cannot start/end with hyphen or contain consecutive hyphens"
                errors=$((errors + 1))
              else
                echo "  ✅ name: $name"
              fi
            fi

            # Check description field
            desc=$(echo "$frontmatter" | grep -E "^description:" | sed 's/^description: *//' | tr -d '"' | tr -d "'")
            if [ -z "$desc" ]; then
              echo "  ❌ Missing 'description' field in frontmatter"
              errors=$((errors + 1))
            else
              echo "  ✅ description: ${desc:0:60}..."
            fi

            # Check template variable consistency (if templates/ exists)
            skill_dir=$(dirname "$skill_file")
            if [ -d "$skill_dir/templates" ]; then
              echo "  📁 Templates directory found"
              template_count=$(find "$skill_dir/templates" -name "*.md" | wc -l | tr -d ' ')
              echo "  📄 $template_count template(s)"
            fi

          done <<< "${{ steps.find.outputs.skills }}"

          if [ $errors -gt 0 ]; then
            echo ""
            echo "❌ Validation failed with $errors error(s)"
            exit 1
          fi
          echo ""
          echo "✅ All skills validated successfully"

  build-index:
    name: Build Discovery Index
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Generate .well-known/agent-skills/index.json
        run: |
          mkdir -p .well-known/agent-skills

          # Start JSON
          echo '{' > .well-known/agent-skills/index.json
          echo '  "$schema": "https://schemas.agentskills.io/discovery/0.2.0/schema.json",' >> .well-known/agent-skills/index.json
          echo '  "skills": [' >> .well-known/agent-skills/index.json

          first=true
          while IFS= read -r skill_file; do
            skill_dir=$(dirname "$skill_file")
            skill_name=$(sed -n '/^---$/,/^---$/p' "$skill_file" | grep -E "^name:" | sed 's/^name: *//' | tr -d '"' | tr -d "'")
            skill_desc=$(sed -n '/^---$/,/^---$/p' "$skill_file" | grep -E "^description:" | sed 's/^description: *//' | tr -d '"' | tr -d "'")
            digest=$(shasum -a 256 "$skill_file" | awk '{print $1}')

            if [ "$first" = true ]; then
              first=false
            else
              echo ',' >> .well-known/agent-skills/index.json
            fi

            cat >> .well-known/agent-skills/index.json <<EOF
    {
      "name": "$skill_name",
      "type": "skill-md",
      "description": "$skill_desc",
      "url": "./$skill_file",
      "digest": "sha256:$digest"
    }
EOF
          done < <(find . -name "SKILL.md" -not -path "./.git/*" -not -path "./.well-known/*" | sed 's|^\./||')

          echo '  ]' >> .well-known/agent-skills/index.json
          echo '}' >> .well-known/agent-skills/index.json

          echo "📋 Generated index.json:"
          cat .well-known/agent-skills/index.json

      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .well-known/agent-skills/index.json
          git diff --cached --quiet || git commit -m "📦 Update skills discovery index"
          git push

  test-install:
    name: Test Installation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test install with npx skills
        run: |
          echo "🧪 Testing skill installation..."
          mkdir -p /tmp/skill-test && cd /tmp/skill-test

          # Test: list available skills from local repo
          npx skills add ${{ github.workspace }} -y --list 2>&1 || true

          # Test: install to claude-code (copy mode)
          npx skills add ${{ github.workspace }} -y -a claude-code --copy 2>&1

          # Verify installation
          echo ""
          echo "📁 Installed files:"
          find . -name "SKILL.md" -o -name "*.md" -o -name "*.json" | head -20

          # Check that SKILL.md exists and is readable
          if find . -name "SKILL.md" | head -1 | grep -q .; then
            echo ""
            echo "✅ Skill installation verified"
          else
            echo ""
            echo "❌ SKILL.md not found after installation"
            exit 1
          fi

  notify:
    name: Post-publish Check
    runs-on: ubuntu-latest
    needs: [validate, build-index, test-install]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Check skills.sh discoverability
        run: |
          echo "🔍 Checking skills.sh search API..."
          response=$(curl -s "https://skills.sh/api/search?q=${{ github.repository_owner }}&limit=5" 2>&1 || echo '{"skills":[]}')
          echo "Response: $response"

          count=$(echo "$response" | grep -o '"count":[0-9]*' | cut -d: -f2 || echo "0")
          echo ""
          echo "📊 Found $count skill(s) from this owner on skills.sh"

      - name: Print install instructions
        run: |
          echo ""
          echo "🎉 Skill published! Users can install with:"
          echo ""
          echo "  npx skills add ${{ github.repository }} -y"
          echo ""
          echo "  Or per-skill:"
          while IFS= read -r skill_file; do
            skill_name=$(sed -n '/^---$/,/^---$/p' "$skill_file" | grep -E "^name:" | sed 's/^name: *//' | tr -d '"' | tr -d "'")
            echo "  npx skills add ${{ github.repository }} -s $skill_name -y"
          done < <(find . -name "SKILL.md" -not -path "./.git/*" -not -path "./.well-known/*" | sed 's|^\./||')
          echo ""
