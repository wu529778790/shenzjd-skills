name: Daily Skills Discovery

on:
  schedule:
    # 每 2 小时触发一次（UTC 0:17, 2:17, 4:17 ... 22:17）
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  discover:
    name: Register on skills.sh
    runs-on: ubuntu-latest
    # 随机延迟 0-30 分钟，避免整点集中
    steps:
      - name: Random delay
        run: |
          delay=$((RANDOM % 1800))
          echo "⏳ 随机延迟 ${delay}s..."
          sleep $delay

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install skills to trigger discovery
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "🔍 Registering skills on skills.sh..."
          npx skills add "$REPO" -y --all 2>&1 || true

      - name: Verify all skills are listed
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "📋 Checking skill discovery..."
          npx skills add "$REPO" -y --list 2>&1

      - name: Search skills.sh for our skills
        run: |
          echo "🔎 Searching skills.sh..."
          for skill in release-notes-generator docker-build-deploy github-profile-beautifier performance-profiler api-doc-generator db-migration-helper git-hooks-setup dependency-audit token-burner; do
            result=$(curl -s "https://skills.sh/api/search?q=${skill}&limit=1" 2>/dev/null)
            count=$(echo "$result" | jq -r '.count // 0 | tonumber' 2>/dev/null || echo "0")
            if [ "$count" -gt 0 ]; then
              installs=$(echo "$result" | jq -r '.skills[0].installs // "?"' 2>/dev/null || echo "?")
              echo "  ✅ $skill — found, installs: $installs"
            else
              echo "  ⏳ $skill — not yet indexed"
            fi
          done
