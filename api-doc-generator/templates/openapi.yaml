openapi: 3.0.3
info:
  title: {{project_name}} API
  description: {{project_description}}
  version: 1.0.0
  contact:
    name: {{author}}
    email: {{email}}

servers:
  - url: http://localhost:{{port}}
    description: 开发环境
  - url: {{production_url}}
    description: 生产环境

paths:
{{#each paths}}
  {{path}}:
    {{method}}:
      summary: {{summary}}
      description: {{description}}
      tags:
        {{#each tags}}
        - {{this}}
        {{/each}}
      {{#if parameters}}
      parameters:
        {{#each parameters}}
        - name: {{name}}
          in: {{in}}
          required: {{required}}
          description: {{description}}
          schema:
            type: {{type}}
        {{/each}}
      {{/if}}
      {{#if requestBody}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/{{requestSchema}}'
      {{/if}}
      responses:
        {{#each responses}}
        '{{status}}':
          description: {{description}}
          {{#if schema}}
          content:
            application/json:
              schema:
                {{schema}}
          {{/if}}
        {{/each}}
{{/each}}

components:
  schemas:
{{#each schemas}}
    {{name}}:
      type: object
      properties:
        {{#each properties}}
        {{name}}:
          type: {{type}}
          description: {{description}}
        {{/each}}
{{/each}}

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
